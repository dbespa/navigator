{% extends 'traffic/layout.html' %}

{% block title %}
Добавление типа загруженности
{% endblock %}

{% block content %}
<div>
  <h1>Добавить тип загруженности:</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.name }}<br>
    {{ form.time_coefficient }}<br>
    {{ form.passability_coefficient }}<br>
    <span>{{ error }}</span>
    <button>Добавить</button>
  </form>
</div>
{% endblock %}
